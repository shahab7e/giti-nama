<title>جام جهان‌نما</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap">
<style>
/* Layout: one quiet header row, a thin row of period shortcuts, the chart (Iran pinned on top), a plain side list, a slim overview strip.
   Look: minimal. Off-white ground, grey ink, hairlines. One accent (Persian blue) marks Iran everywhere; everything else stays neutral. */
:root{
  --bg:#fafaf9; --surface:#ffffff; --sunk:#f2f2f0; --ink:#1d1d1f; --ink2:#55555b; --muted:#8e8e93;
  --line:#ececea; --line2:#dedede; --accent:#2c5bd0; --accent-ink:#1c3d8f; --tint:#e7eefc; --tint2:#d3e0f9;
  --shadow:0 8px 28px rgba(20,20,30,.10);
  --f-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1a1a1d; --sunk:#202024; --ink:#ececef; --ink2:#b4b4bb; --muted:#808088;
  --line:#26262a; --line2:#323238; --accent:#7ea2ff; --accent-ink:#c9d7ff; --tint:#1f2a44; --tint2:#2a3a60;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}

.top{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-title{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand-title b{color:var(--accent);font-weight:800}
.brand-sub{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-wrap{position:relative;flex:1 1 220px;min-width:0;max-width:380px;margin-inline-start:auto}
.search{width:100%;padding:7px 14px;border-radius:10px;border:1px solid transparent;background:var(--sunk);outline:none;font-size:13px}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--accent);background:var(--surface)}
.qres{position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:30;margin:0;padding:6px;list-style:none;max-height:60vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
.qres li{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.qres li[aria-selected="true"],.qres li:hover{background:var(--sunk)}
.qres .k{color:var(--muted);font-size:12px;white-space:nowrap}
.tools{display:flex;gap:2px;flex-wrap:wrap}
.tbtn{padding:6px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.tbtn:hover{background:var(--sunk);color:var(--ink)}
.tbtn-on{color:var(--accent)}
.layers{position:absolute;top:100%;inset-inline-end:max(16px,env(safe-area-inset-left,0px));z-index:40;display:grid;gap:10px;padding:14px 16px;
  background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
.layers label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}
.layers input{accent-color:var(--accent)}

.eras{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.eras::-webkit-scrollbar{display:none}
.chip{flex:none;padding:3px 10px;border-radius:999px;border:0;background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.chip:hover{background:var(--sunk);color:var(--ink)}
.chip.iran{color:var(--accent-ink)}
.chip-sep{flex:none;width:1px;height:14px;background:var(--line2);margin-inline:6px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.main.nopanel{grid-template-columns:minmax(0,1fr) 0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;background:var(--bg)}
#tl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#tl.drag{cursor:grabbing}
.hint{position:absolute;bottom:14px;inset-inline-start:50%;transform:translateX(50%);font-size:12px;color:var(--ink2);
  background:var(--surface);padding:5px 14px;border-radius:999px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}

.tip{position:absolute;z-index:20;max-width:300px;pointer-events:none;padding:10px 12px;border-radius:10px;
  background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);font-size:12.5px;line-height:1.75}
.tip h4{margin:0;font-size:14px;font-weight:700}
.tip .en{color:var(--muted);font-size:11px;direction:ltr;text-align:right}
.tip .yr{color:var(--ink2);font-variant-numeric:tabular-nums}
.tip p{margin:4px 0 0;color:var(--ink2)}
.tip .tag{display:inline-block;margin-top:4px;font-size:11px;color:var(--muted)}

.panel{min-width:0;min-height:0;display:flex;flex-direction:column;border-inline-start:1px solid var(--line);background:var(--surface);overflow:hidden}
.main.nopanel .panel{display:none}
.panel-head{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.panel-kicker{font-size:11.5px;color:var(--muted)}
.panel-year{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.4}
.panel-cal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel-focus{margin-top:6px;font-size:12.5px;color:var(--accent-ink);background:var(--tint);padding:4px 10px;border-radius:8px;display:inline-block}
.panel-focus:empty{display:none}
.panel-body{overflow:auto;padding:6px 10px 24px;flex:1;min-height:0}
.reg{padding:8px 8px 6px;border-bottom:1px solid var(--line)}
.reg:last-child{border-bottom:0}
.reg h5{margin:0 0 2px;font-size:11.5px;color:var(--muted);font-weight:500}
.reg.iran{background:var(--tint);border-radius:10px;border:0;margin:6px 0}
.reg.iran h5{color:var(--accent-ink);font-weight:700}
.it{display:flex;gap:8px;padding:4px 0;cursor:pointer;line-height:1.6;font-size:13px}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.it .tx{flex:1;min-width:0}
.it .l1{display:flex;justify-content:space-between;gap:10px}
.it:hover .nm{color:var(--accent)}
.it .nm{min-width:0;font-weight:600}
.it-ruler .nm,.it-person .nm{font-weight:500}
.it .sub .tag{font-weight:600;color:var(--ink2)}
.reg h5 .badge{display:inline-block;margin-inline-start:6px;padding:0 7px;border-radius:999px;color:#fff;font-size:10.5px;font-weight:700;line-height:1.7}
.dom-box{margin:6px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--c);background:var(--sunk)}
.dom-t{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:2px}
.dom-btn{margin-top:8px;width:100%;padding:6px 10px;border-radius:8px;border:0;background:var(--c);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.regions{width:min(560px,calc(100vw - 32px));max-height:70vh;overflow:auto}
.rg-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:baseline}
.lnk{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px}
.rg-list{columns:2 210px;column-gap:20px}
.rg-grp{break-inside:avoid;display:grid;gap:5px;margin-bottom:12px}
.rg-gt{justify-self:start;border:0;background:none;padding:0;font-size:12px;font-weight:800;color:var(--accent-ink);cursor:pointer}
.it .yy{color:var(--muted);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.it .sub{color:var(--muted);font-size:11.5px}
.sec-t{margin:14px 8px 2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sec{border-bottom:1px solid var(--line2)}
.sec>summary{position:sticky;top:-6px;z-index:1;display:flex;align-items:center;gap:8px;padding:10px 6px 8px;cursor:pointer;font-size:13.5px;font-weight:800;background:var(--surface)}
.sec>summary .n{font-size:11px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:999px;padding:0 8px}
.nest{margin-inline-start:4px;padding-inline-start:12px;border-inline-start:2px solid var(--line2);margin-bottom:4px}
.nest .it{padding:2px 0;font-size:12.5px}
.nest .it .dot{width:6px;height:6px;margin-top:7px}
.more{font-size:11.5px;color:var(--muted);padding:2px 17px 4px}
.empty{color:var(--muted);font-size:12.5px;padding:12px 8px}

.mini{height:40px;border-top:1px solid var(--line);background:var(--surface);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#minimap{width:100%;height:100%;display:block;cursor:pointer}

.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,10,20,.35);padding:16px}
.modal-card{position:relative;max-width:600px;width:100%;max-height:85vh;overflow:auto;padding:24px 26px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);line-height:1.95}
.modal-card h2{margin:0 0 8px;font-size:17px}
.modal-card p,.modal-card li{color:var(--ink2);font-size:13.5px}
.modal-x{position:absolute;top:10px;inset-inline-end:14px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}

@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr)}
  .main.nopanel{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;inset-inline-end:0;top:auto;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:min(360px,100%);height:min(70vh,560px);z-index:25;
    border:1px solid var(--line2);border-radius:14px 14px 0 0;box-shadow:var(--shadow)}
}
@media (max-width:700px){
  .brand-sub{display:none}
  .search-wrap{order:3;flex-basis:100%;max-width:none;margin-inline-start:0}
  .tools .tbtn{padding:5px 7px;font-size:12px}
  .panel{width:100%;height:50vh}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<script>document.documentElement.dir='rtl';document.documentElement.lang='fa';</script>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1 class="brand-title">جام <b>جهان‌نما</b></h1>
      <p class="brand-sub">ایران و جهان، هم‌زمان، از نخستین تمدن‌ها تا امروز</p>
    </div>
    <div class="search-wrap">
      <input id="q" class="search" type="search" placeholder="جست‌وجو: ناصرالدین شاه، ساسانیان، رنسانس…" autocomplete="off" aria-label="جست‌وجو در تاریخ">
      <ul id="qres" class="qres" hidden></ul>
    </div>
    <nav class="tools" aria-label="ابزارها">
      <button id="btnRegions" class="tbtn" aria-haspopup="true" aria-expanded="false" title="انتخاب سرزمین‌ها برای مقایسه">سرزمین‌ها</button>
      <button id="btnLayers" class="tbtn" aria-haspopup="true" aria-expanded="false" title="لایه‌ها">لایه‌ها</button>
      <button id="btnScale" class="tbtn" title="تغییر مقیاس زمان">مقیاس: فشرده</button>
      <button id="btnDir" class="tbtn" title="جهت گذر زمان">زمان: چپ←راست</button>
      <button id="btnTheme" class="tbtn" title="روشن/تاریک">پوسته</button>
      <button id="btnPanel" class="tbtn tbtn-on" aria-controls="panel" aria-expanded="true">برش زمان</button>
      <button id="btnAbout" class="tbtn" title="روش و منابع">؟</button>
    </nav>
    <div id="regions" class="layers regions" hidden>
      <div class="rg-head"><b>سرزمین‌هایی که زیر ایران دیده شوند</b><span><button type="button" class="lnk" id="rgAll">همه</button> · <button type="button" class="lnk" id="rgNone">هیچ</button></span></div>
      <div id="rgList" class="rg-list"></div>
    </div>
    <div id="layers" class="layers" hidden>
      <label><input type="checkbox" id="lyRulers" checked> فرمانروایان</label>
      <label><input type="checkbox" id="lyEvents" checked> رویدادها</label>
      <label><input type="checkbox" id="lyPeople" checked> چهره‌ها</label>
      <label><input type="checkbox" id="lyLinks"> پیوند جانشینی دودمان‌های ایران</label>
    </div>
  </header>

  <div class="eras" id="eraChips" aria-label="پرش به دوره"></div>

  <div class="main">
    <section class="stage" id="stage">
      <canvas id="tl" aria-label="نمودار زمانی تعاملی تاریخ ایران و جهان" role="img"></canvas>
      <div id="tip" class="tip" hidden></div>
      <div class="hint" id="hint">کشیدن = جابه‌جایی · چرخ موس = بزرگ‌نمایی · کلیک = ثابت‌کردن برش زمان</div>
    </section>
    <aside class="panel" id="panel" aria-live="polite">
      <div class="panel-head">
        <div class="panel-kicker">برش زمان · جهان در این لحظه</div>
        <div class="panel-year" id="pYear">—</div>
        <div class="panel-cal" id="pCal"></div>
        <div class="panel-focus" id="pFocus"></div>
      </div>
      <div class="panel-body" id="pBody"></div>
    </aside>
  </div>

  <footer class="mini">
    <canvas id="minimap" aria-label="نقشهٔ کوچک کل زمان"></canvas>
  </footer>

  <div class="modal" id="about" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="aboutT">
      <button class="modal-x" id="aboutX" aria-label="بستن">×</button>
      <h2 id="aboutT">روش و قراردادهای گاه‌شماری</h2>
      <div id="aboutBody"></div>
    </div>
  </div>
</div>

<script>
/* js/core.js */
/* جام جهان‌نما — data registry + shared helpers. Data files call TL.add*(). Years: negative = BC (‎-550 = ۵۵۰ پ.م). */
(function () {
  const TL = {
    regions: [], regionById: {}, polities: [], polityById: {}, rulers: [], events: [], people: [],
    eras: [], iranEras: [], chips: [], links: [], errors: []
  };
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  // ---------- registry ----------
  TL.addRegions = function (arr) {
    arr.forEach((r, i) => {
      const reg = Object.assign({ order: TL.regions.length, grp: '' }, r);
      TL.regions.push(reg); TL.regionById[reg.id] = reg;
    });
  };
  // row: [id, name, en, start, end, opts]  opts: {p:peak, a:approx(true|'s'|'e'), cap, d, k:kind, lv:1..3, c:color, sub:'iran-local'}
  TL.addPolities = function (regionId, rows) {
    rows.forEach(row => {
      const [id, n, en, s, e, o = {}] = row;
      if (own(TL.polityById, id)) TL.errors.push('duplicate polity id: ' + id);
      const p = { id, r: regionId, n, en, s, e, p: o.p, a: o.a || false, cap: o.cap || '', d: o.d || '',
        k: o.k || 'state', lv: o.lv || 2, c: o.c || null, idx: 0, rulers: [] };
      TL.polities.push(p); TL.polityById[id] = p;
    });
  };
  // row: [name, en, start, end, opts]  opts: {d, a}
  TL.addRulers = function (polityId, rows) {
    rows.forEach(row => {
      const [n, en, s, e, o = {}] = row;
      const r = { pid: polityId, n, en, s, e, d: o.d || '', a: o.a || false, t: o.t || '' };
      TL.rulers.push(r);
    });
  };
  // row: [year, name, opts]  opts: {y2, k:'pol'|'war'|'cul'|'sci'|'rel'|'dis'|'eco', d, w:1..3, a, en}
  TL.addEvents = function (regionId, rows) {
    rows.forEach(row => {
      const [y, n, o = {}] = row;
      TL.events.push({ r: regionId, y, y2: o.y2, n, en: o.en || '', k: o.k || 'pol', d: o.d || '', w: o.w || 2, a: o.a || false });
    });
  };
  // row: [name, en, born, died, kind, opts]  kind: poet|sci|phil|rel|art|pol|mil|exp ; opts: {d, a}
  TL.addPeople = function (regionId, rows) {
    rows.forEach(row => {
      const [n, en, b, dd, k, o = {}] = row;
      TL.people.push({ r: regionId, n, en, s: b, e: dd, k: k || 'pol', d: o.d || '', a: o.a || false });
    });
  };
  TL.extent = {};
  TL.setExtent = (m) => Object.assign(TL.extent, m);
  TL.addEras = (rows) => rows.forEach(([n, s, e, c]) => TL.eras.push({ n, s, e, c }));
  TL.addIranEras = (rows) => rows.forEach(([n, s, e, c]) => TL.iranEras.push({ n, s, e, c }));
  TL.addChips = (rows) => rows.forEach(([n, s, e, iran]) => TL.chips.push({ n, s, e, iran: !!iran }));
  TL.addLinks = (ids) => TL.links.push(ids);

  // ---------- number + date formatting ----------
  const FA = '۰۱۲۳۴۵۶۷۸۹';
  TL.fa = (v) => String(v).replace(/[0-9]/g, d => FA[d]);
  // fractional years mark a month inside the year (1882.7 = autumn 1882), so AD years floor
  const yr = (y) => (y < 0 ? Math.round(-y) : Math.floor(y + 1e-9));
  TL.yearLabel = function (y, approx) {
    const pre = approx ? 'حدود ' : '';
    if (y < 0) return pre + TL.fa(yr(y)) + ' پ.م';
    return pre + TL.fa(yr(y)) + ' م';
  };
  TL.yearShort = (y) => (y < 0 ? TL.fa(yr(y)) + ' پ.م' : TL.fa(yr(y)));
  TL.spanLabel = function (s, e, a) {
    const as = a === true || a === 's', ae = a === true || a === 'e';
    if (s < 0 && e < 0) return (as ? 'حدود ' : '') + TL.fa(-s) + ' تا ' + (ae ? 'حدود ' : '') + TL.fa(-e) + ' پ.م';
    return TL.yearLabel(s, as) + ' تا ' + (e >= 2026.5 ? 'اکنون' : TL.yearLabel(e, ae));
  };
  // no year zero: 1 BC is followed by AD 1
  TL.duration = (s, e) => Math.round(e - s - (s < 0 && e > 0 ? 1 : 0));
  // Solar Hijri (Nowruz ≈ 21 March) and Lunar Hijri approximations; only from 622 CE
  TL.calendars = function (y) {
    y = Math.floor(y);
    if (y < 622) return null;
    const sh1 = y - 622, sh2 = y - 621;
    const ah1 = Math.floor((y - 622) * 1.030684 + 0.46), ah2 = Math.floor((y + 1 - 622) * 1.030684 + 0.46);
    return {
      sh: sh1 <= 0 ? TL.fa(Math.max(sh2, 1)) : TL.fa(sh1) + '–' + TL.fa(sh2),
      ah: ah1 === ah2 ? TL.fa(Math.max(ah1, 1)) : TL.fa(Math.max(ah1, 1)) + '–' + TL.fa(ah2)
    };
  };

  // ---------- time scale: piecewise "compressed" warp (deep past gets less width) or linear ----------
  TL.T0 = -10000; TL.T1 = 2030; TL.NOW = 2026.9;
  const WARP = [[-10000, 0], [-4000, 70], [-3000, 160], [-1000, 430], [0, 650], [1000, 870], [1500, 1075], [1800, 1240], [1900, 1325], [2030, 1425]];
  const LIN = [[-10000, 0], [2030, 1425]];
  TL.scaleMode = 'warp';
  const pts = () => (TL.scaleMode === 'warp' ? WARP : LIN);
  TL.u = function (y) {
    const P = pts();
    if (y <= P[0][0]) return P[0][1] + (y - P[0][0]) * (P[1][1] - P[0][1]) / (P[1][0] - P[0][0]);
    for (let i = 1; i < P.length; i++) {
      if (y <= P[i][0]) { const [y0, u0] = P[i - 1], [y1, u1] = P[i]; return u0 + (y - y0) * (u1 - u0) / (y1 - y0); }
    }
    const n = P.length - 1; return P[n][1] + (y - P[n][0]) * (P[n][1] - P[n - 1][1]) / (P[n][0] - P[n - 1][0]);
  };
  TL.yOfU = function (u) {
    const P = pts();
    for (let i = 1; i < P.length; i++) {
      if (u <= P[i][1] || i === P.length - 1) { const [y0, u0] = P[i - 1], [y1, u1] = P[i]; return y0 + (u - u0) * (y1 - y0) / (u1 - u0); }
    }
    return P[P.length - 1][0];
  };

/* Canvas engine. Visual model borrowed from printed "rise and fall of nations" charts:

(function () {
  const R = {}; window.R = R;
  const S = R.S = {
    dir: 'ltr', k: 1, u0: 0, scrollY: 0, hoverX: null, hoverY: null, pinYear: null, focus: null,
    layers: { rulers: true, events: true, people: true, links: false }, show: null, focusSet: null,
    W: 0, H: 0, dpr: 1, C: {}, hits: [], lanes: [], iran: null, worldTop: 0, worldH: 0, maxScroll: 0,
    LW: 132, AX: 44, CAL: 26, PW: 0, dark: false

  const mcache = new Map();
  const UI = '"Vazirmatn", Tahoma, "Segoe UI", sans-serif';

  // foreign rule over Iran (muted inside the Iran band) and Iranian rule abroad (drawn in the Iranian dynasty's own colour)

    const p = TL.polityById[cid]; if (!p) return;

    p.of.forEach(q => (q.dom = q.dom || []).push(p));

  TL.overlord = (p, a = -1e9, b = 1e9) => {
    const b2 = Math.max(b, a + 0.01); let best = null, bv = 0;
    (p.of || []).forEach(q => { const v = Math.min(p.e, q.e, b2) - Math.max(p.s, q.s, a); if (v > bv) { bv = v; best = q; } });

  };
  TL.isIranian = (p) => (p.r === 'iran' ? !TL.FOREIGN.has(p.id) : !!(p.of && p.of.some(q => q.r === 'iran' && !TL.FOREIGN.has(q.id))));

    'اروپا': { h: 348, strong: '#c4385a' }, 'آفریقا': { h: 28, strong: '#a35a22' }, 'قارهٔ آمریکا و اقیانوسیه': { h: 268, strong: '#6c48b8' }
  };

  // ---------- coordinates ----------
  R.xOfU = (u) => (S.dir === 'ltr' ? (u - S.u0) * S.k : S.PW - (u - S.u0) * S.k);

    if (span >= hi - lo) S.u0 = lo - (span - (hi - lo)) / 2; else S.u0 = Math.min(hi - span, Math.max(lo, S.u0));

    TL.polities.forEach(p => { buildProfile(p); p.pS = p.s; p.pE = Math.max(p.e, p.s + 1); (polByReg[p.r] = polByReg[p.r] || []).push(p); });

    const sorter = (a, b) => (a.lv || 2) - (b.lv || 2) || a.s - b.s || (b.e - b.s) - (a.e - a.s);

    const ipAll = (polByReg.iran || []).slice().sort(sorter);

    const ipLocal = ipAll.filter(p => p.lv >= 3);

    ir.rowH.forEach(h => { ir.rowY.push(y); y += h; });

    if (S.layers.people && shown('iran_people')) {
      const ipp = TL.people.filter(p => p.r === 'iran').sort((a, b) => a.s - b.s);
      const PL = { reg: { id: 'iran_people', n: 'چهره‌های ایران', en: 'Iranian figures', hue: 220, grp: 'ایران' }, people: true, grpHead: iranHead, iranX: true, idx: li++ };

      const PL = { reg: { id: 'people', n: 'چهره‌های جهان', en: 'World figures', hue: 30, grp: '' }, people: true, grpHead: 'چهره‌های ماندگار جهان', idx: li++ };

  // ---------- primitives ----------

  // ---------- a state: flowing shape, thickness = territory ----------

  // ---------- dominion: faint column over the lane + a labelled ribbon in the empire's colour ----------

  // ---------- rulers ----------

  // ---------- events ----------

  // ---------- people ----------

  // ---------- axis + calendar bands ----------

  // ---------- frame ----------
  R.draw = function () {

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
    ctx.fillStyle = S.C.bg; ctx.fillRect(0, 0, W, H);
    const ticks = R.ticks(), ir = S.iran, wTop = S.worldTop, wBot = H - S.CAL;
    const grid = (y0, y1) => ticks.forEach(t => { ctx.fillStyle = S.dark ? 'rgba(255,255,255,.06)' : 'rgba(40,30,80,.07)'; ctx.fillRect(R.x(t.y), y0, 1, y1 - y0); });

     ['رویدادها', 'event', TL.events.filter(e => over(e.y, e.y2 || e.y, A, B)), e => TL.yearShort(e.y), (p, q) => p.y - q.y],
     ['چهره‌ها', 'person', TL.people.filter(p => over(p.s, p.e, a, b)), span, (p, q) => p.s - q.s]
    ].forEach(([title, type, items, yy, sort]) => {
      const byReg = new Map();
      items.filter(it => inR(rOf(it, type))).sort((p, q) => TL.regionById[rOf(p, type)].order - TL.regionById[rOf(q, type)].order || sort(p, q))
        .forEach(it => { const r = rOf(it, type); if (!byReg.has(r)) byReg.set(r, []); byReg.get(r).push(it); });
      if (!byReg.size) return;
      const n = [...byReg.values()].reduce((s, l) => s + l.length, 0);
      html += `<details class="sec" data-sec="${type}"${closed.has(type) ? '' : ' open'}><summary>${title}<span class="n">${TL.fa(n)}</span></summary>`;
      byReg.forEach((list, r) => {
        const lords = type === 'polity' ? [...new Set(list.map(p => TL.overlord(p, a, b)).filter(Boolean))] : [];
        const badges = lords.map(q => `<span class="badge" style="background:${q.base}">زیر فرمان ${esc(q.n)}</span>`).join('');
        const cap = r === 'iran' ? 14 : 8;
        html += `<div class="reg ${r === 'iran' ? 'iran' : ''}"><h5>${esc(TL.regionById[r].n)}${badges}</h5>`;
        list.slice(0, cap).forEach(it => {
          html += rowHTML(it, type, it.n, yy(it));
          if (type === 'polity' && rulBy.has(it.id)) html += `<div class="nest">${rulBy.get(it.id).map(r => rowHTML(r, 'ruler', r.n, span(r))).join('')}</div>`;
        });
        if (list.length > cap) html += `<div class="more">و ${TL.fa(list.length - cap)} مورد دیگر</div>`;
        html += '</div>';
      });
      html += '</details>';
    });
    body.innerHTML = html || '<div class="empty">برای این برش داده‌ای ثبت نشده است.</div>';
  }
  $('pBody').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.dom-btn');
    if (btn) { const emp = TL.polityById[btn.dataset.emp]; setShow(new Set(emp.dom.map(p => p.r).concat(emp.r).filter(r => r !== 'iran'))); return; }
    const el = ev.target.closest('.it'); if (!el) return;
    const [it, type] = reg[+el.dataset.k]; select(it, type, true);
  });
  function openPanel(force) {
    const m = document.querySelector('.main'), btn = $('btnPanel');
    const open = force === true ? true : force === false ? false : m.classList.contains('nopanel');
    m.classList.toggle('nopanel', !open); btn.setAttribute('aria-expanded', String(open));
    if (window.innerWidth <= 1100) $('panel').hidden = !open; else $('panel').hidden = false;
  }
  $('btnPanel').onclick = () => openPanel();

  // ---------- search ----------
  const index = [];
  TL.polities.forEach(p => index.push([p, 'polity', TL.regionById[p.r].n]));
  TL.rulers.forEach(r => index.push([r, 'ruler', 'فرمانروا · ' + (TL.polityById[r.pid] ? TL.polityById[r.pid].n : '')]));
  TL.events.forEach(e => index.push([e, 'event', 'رویداد · ' + TL.yearShort(e.y)]));
  TL.people.forEach(p => index.push([p, 'person', TL.PKIND[p.k] || 'چهره']));
  index.forEach(row => { row.key = TL.norm(row[0].n + ' ' + (row[0].en || '')); });
  const q = $('q'), qres = $('qres'); let qsel = 0, qlist = [];
  function runSearch() {
    const s = TL.norm(q.value); if (s.length < 2) { qres.hidden = true; return; }
    const parts = s.split(' ');
    qlist = index.filter(r => parts.every(p => r.key.includes(p)))
      .sort((a, b) => (a[0].n.length - b[0].n.length)).slice(0, 14);
    qsel = 0;
    qres.innerHTML = qlist.map((r, i) => `<li role="option" data-i="${i}" aria-selected="${i === 0}"><span>${esc(r[0].n)}</span><span class="k">${esc(r[2])}</span></li>`).join('') || '<li><span>یافت نشد</span></li>';
    qres.hidden = false;
  }
  function pick(i) { const r = qlist[i]; if (!r) return; qres.hidden = true; q.blur(); select(r[0], r[1], true); }
  q.addEventListener('input', runSearch);
  q.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); qsel = (qsel + (ev.key === 'ArrowDown' ? 1 : -1) + qlist.length) % Math.max(qlist.length, 1); [...qres.children].forEach((li, i) => li.setAttribute('aria-selected', String(i === qsel))); }
    if (ev.key === 'Enter') pick(qsel);
    if (ev.key === 'Escape') qres.hidden = true;
  });
  qres.addEventListener('pointerdown', (ev) => { const li = ev.target.closest('li[data-i]'); if (li) { ev.preventDefault(); pick(+li.dataset.i); } });
  q.addEventListener('blur', () => setTimeout(() => (qres.hidden = true), 150));

  // ---------- era chips ----------
  const chipHTML = (c) => `<button class="chip ${c.iran ? 'iran' : ''}" data-i="${TL.chips.indexOf(c)}">${esc(c.n)}</button>`;
  $('eraChips').innerHTML = TL.chips.filter(c => c.iran).map(chipHTML).join('') + '<span class="chip-sep" aria-hidden="true"></span>' + TL.chips.filter(c => !c.iran).map(chipHTML).join('');
  $('eraChips').addEventListener('click', (ev) => {
    const b = ev.target.closest('.chip'); if (!b) return; const c = TL.chips[+b.dataset.i];
    S.focus = null; S.pinYear = null; animateTo(c.s, c.e); setTimeout(updatePanel, 560);
  });

  // ---------- toolbar ----------
  $('btnScale').onclick = () => {
    const c = R.yearAt(S.PW / 2), [v0, v1] = R.visRange();
    TL.scaleMode = TL.scaleMode === 'warp' ? 'linear' : 'warp';
    $('btnScale').textContent = 'مقیاس: ' + (TL.scaleMode === 'warp' ? 'فشرده' : 'خطی');
    R.fit(v0, v1, 0); if (TL.scaleMode === 'linear') { S.u0 = TL.u(c) - S.PW / S.k / 2; R.clampView(); } redraw();
  };
  $('btnDir').onclick = () => {
    S.dir = S.dir === 'ltr' ? 'rtl' : 'ltr';
    $('btnDir').textContent = 'زمان: ' + (S.dir === 'ltr' ? 'چپ←راست' : 'راست←چپ');
    redraw();
  };
  // the manuscript (paper) look is the default; "night" is an explicit choice
  let night = false;
  try { night = localStorage.getItem('jam-theme') === 'dark'; } catch (e) { }
  function applyTheme() {
    if (night) document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
    $('btnTheme').textContent = night ? 'روشن' : 'تیره';
    try { localStorage.setItem('jam-theme', night ? 'dark' : 'light'); } catch (e) { }
    R.readTheme(); redraw();
  }
  $('btnTheme').onclick = () => { night = !night; applyTheme(); };
  $('btnLayers').onclick = () => { const l = $('layers'); l.hidden = !l.hidden; $('regions').hidden = true; $('btnLayers').setAttribute('aria-expanded', String(!l.hidden)); };
  [['lyRulers', 'rulers'], ['lyEvents', 'events'], ['lyPeople', 'people'], ['lyLinks', 'links']].forEach(([id, k]) => {
    $(id).addEventListener('change', (ev) => { S.layers[k] = ev.target.checked; relayout(true); });
  });
  // ---------- region filter: pick a few lands and see them right under Iran ----------
  const LANES = [['iran_local', 'دودمان‌های محلی ایران', 'ایران'], ['iran_people', 'چهره‌های ایران', 'ایران']]
    .concat(TL.regions.filter(r => r.id !== 'iran').map(r => [r.id, r.n, r.grp]), [['people', 'چهره‌های جهان', 'چهره‌ها']]);
  const groups = [...new Set(LANES.map(l => l[2]))];
  $('rgList').innerHTML = groups.map(g => `<div class="rg-grp"><button type="button" class="rg-gt" data-g="${esc(g)}">${esc(g)}</button>` +
    LANES.filter(l => l[2] === g).map(([id, n]) => `<label><input type="checkbox" value="${id}"> ${esc(n)}</label>`).join('') + '</div>').join('');
  const boxes = () => [...$('rgList').querySelectorAll('input')];
  function setShow(set, keepPopover) {
    S.show = set && set.size < LANES.length ? set : null;
    boxes().forEach(b => (b.checked = !S.show || S.show.has(b.value)));
    $('btnRegions').textContent = 'سرزمین‌ها' + (S.show ? ` (${TL.fa(S.show.size)})` : '');
    $('btnRegions').classList.toggle('tbtn-on', !!S.show);
    try { localStorage.setItem('jam-regions', S.show ? [...S.show].join(',') || '-' : ''); } catch (e) { }
    if (!keepPopover) $('regions').hidden = true;
    S.scrollY = 0; relayout(true); updatePanel();
  }
  const fromBoxes = () => setShow(new Set(boxes().filter(b => b.checked).map(b => b.value)), true);
  $('rgList').addEventListener('change', fromBoxes);
  $('rgList').addEventListener('click', (ev) => {
    const g = ev.target.closest('.rg-gt'); if (!g) return;
    const bs = boxes().filter(b => LANES.find(l => l[0] === b.value)[2] === g.dataset.g);
    // from "all", a group title means "only this group"; otherwise it toggles the group
    if (!S.show) { boxes().forEach(b => (b.checked = false)); bs.forEach(b => (b.checked = true)); }
    else { const on = !bs.every(b => b.checked); bs.forEach(b => (b.checked = on)); }
    fromBoxes();
  });
  $('rgAll').onclick = () => setShow(null, true);
  $('rgNone').onclick = () => setShow(new Set(), true);
  $('btnRegions').onclick = () => { const l = $('regions'); l.hidden = !l.hidden; $('layers').hidden = true; $('btnRegions').setAttribute('aria-expanded', String(!l.hidden)); };
  try { const v = localStorage.getItem('jam-regions'); if (v) S.show = new Set(v === '-' ? [] : v.split(',')); } catch (e) { }

  $('btnAbout').onclick = () => { $('about').hidden = false; };
  $('aboutX').onclick = () => { $('about').hidden = true; };
  $('about').addEventListener('click', (ev) => { if (ev.target.id === 'about') $('about').hidden = true; });
  const counts = `${TL.fa(TL.polities.length)} حکومت و دوره، ${TL.fa(TL.rulers.length)} فرمانروا، ${TL.fa(TL.events.length)} رویداد و ${TL.fa(TL.people.length)} چهره`;
  $('aboutBody').innerHTML = `<p>این نقشهٔ زمانی ${counts} را در ${TL.fa(TL.regions.length)} منطقه کنار هم می‌گذارد. ایران در بالای صفحه ثابت است و جهان زیر آن می‌گذرد. روی هر حکومت، شاه یا رویداد کلیک کنید تا ستون هم‌زمانی آن در همهٔ جهان روشن شود و فهرست هم‌روزگارانش در پنل «برش زمان» بیاید.</p>
  <ul>
  <li>سال‌ها میلادی‌اند و «پ.م» یعنی پیش از میلاد. سال صفر وجود ندارد و مدت‌ها با همین قاعده حساب می‌شود.</li>
  <li>سال خورشیدی و قمری تقریبی و به‌صورت بازهٔ دوساله نشان داده می‌شود، چون نوروز و آغاز سال قمری با ژانویه هم‌خوان نیستند.</li>
  <li>گاه‌شماری میان‌رودان بر پایهٔ «گاه‌شماری میانه» است. سلسله‌های مصر بر پایهٔ تاریخ‌های رایج (شاو، تاریخ آکسفورد مصر باستان) آمده‌اند.</li>
  <li>تاریخ‌های پیش از ۱۰۰۰ پ.م و بسیاری از شاهان اشکانی تقریبی‌اند. این موارد با پیشوند «حدود» و لبه‌های محوشده نشان داده شده‌اند.</li>
  <li>ضخامت هر شکل در هر سال با ریشهٔ دوم مساحت برآوردی قلمرو همان حکومت در آن سال تغییر می‌کند. بیشینه‌ها از فهرست «بزرگ‌ترین امپراتوری‌ها»ی ویکی‌پدیا (بیشتر برآوردهای تاگه‌پرا) آمده‌اند و نقطه‌های میانی منحنی تقریبی‌اند. حکومت‌هایی که داده‌ای برایشان نبود، ضخامت پیش‌فرض دارند.</li>
  <li>در نوار ایران، شکل‌های خاکستری یعنی فرمانروایی بیگانه (مقدونیان، سلوکیان، خلافت و حاکمان مغول) و ضخامت آن‌ها فقط سهم ایران را نشان می‌دهد. اگر رنگ یک دودمان ایرانی در منطقهٔ دیگری دیده شود، یعنی آن سرزمین زیر فرمان ایران بوده است.</li>
  <li>نوار رنگی «زیر فرمان …» بالای هر منطقه یعنی آن سرزمین در آن سال‌ها بخشی از آن امپراتوری بوده است. با کلیک روی یک امپراتوری همهٔ سرزمین‌هایش پررنگ می‌شوند و در پنل فهرست می‌آیند.</li>
  <li>با دکمهٔ «سرزمین‌ها» می‌توانید فقط چند منطقه را برگزینید تا درست زیر ایران و کنار هم دیده شوند.</li>
  <li>مقیاس «فشرده» به هزاره‌های دور جای کمتری می‌دهد. با دکمهٔ مقیاس می‌توانید زمان را خطی ببینید.</li>
  <li>رویدادهای ۲۰۲۵ و ۲۰۲۶ تا جایی آمده‌اند که در گزارش‌های خبری تأیید شده‌اند.</li>
  </ul>
  <p>کلیدها: ← → جابه‌جایی، ↑ ↓ پیمایش منطقه‌ها، + − بزرگ‌نمایی، Esc پاک‌کردن انتخاب. Shift+چرخ موس منطقه‌ها را بالا و پایین می‌برد.</p>`;

  // ---------- minimap ----------
  let mW = 0, mH = 0;
  function sizeMini() { const r = mm.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); mW = r.width; mH = r.height; mm.width = mW * d; mm.height = mH * d; mctx.setTransform(d, 0, 0, d, 0, 0); }
  const mx = (y) => { const t = (TL.u(y) - TL.U0()) / (TL.U1() - TL.U0()); return S.dir === 'ltr' ? t * mW : mW - t * mW; };
  function drawMini() {
    if (!mW) return; const C = S.C; mctx.clearRect(0, 0, mW, mH);
    mctx.fillStyle = C.sunk; mctx.fillRect(0, 0, mW, mH);
    // the pinned Iran band in miniature (all 27 lands in 40px came out thinner than a pixel)
    const rows = S.iran.rows, lh = (mH - 15) / rows.length;
    rows.forEach((row, ri) => row.forEach(p => {
      const xa = mx(p.s), xb = mx(Math.min(p.e, TL.NOW));
      mctx.fillStyle = p.base; mctx.fillRect(Math.min(xa, xb), 1 + ri * lh, Math.max(Math.abs(xb - xa), 1), lh - 0.6);
    }));
    mctx.font = '500 9.5px Vazirmatn, Tahoma, sans-serif'; mctx.fillStyle = C.muted; mctx.textAlign = 'center'; mctx.textBaseline = 'bottom'; mctx.direction = 'rtl';
    const placed = [];
    [-8000, -5000, -3000, -2000, -1000, 0, 500, 1000, 1500, 1800, 2000].forEach(y => {
      const t = y < 0 ? TL.fa(-y) + ' پ.م' : TL.fa(y || 1), x = mx(y), w = mctx.measureText(t).width + 8;
      if (x < w / 2 || x > mW - w / 2 || placed.some(px => Math.abs(px - x) < w)) return;
      placed.push(x); mctx.fillText(t, x, mH - 1);
    });
    const [v0, v1] = R.visRange(), xa = mx(v0), xb = mx(v1);
    mctx.strokeStyle = C.accent; mctx.lineWidth = 1.2; mctx.fillStyle = S.dark ? 'rgba(126,162,255,.10)' : 'rgba(44,91,208,.08)';
    mctx.fillRect(Math.min(xa, xb), 1, Math.abs(xb - xa), mH - 14); mctx.strokeRect(Math.min(xa, xb), 1, Math.abs(xb - xa), mH - 14);
  }
  let mdrag = false;
  const mmGo = (ev) => { const r = mm.getBoundingClientRect(), x = ev.clientX - r.left, t = S.dir === 'ltr' ? x / mW : 1 - x / mW; const u = TL.U0() + t * (TL.U1() - TL.U0()); S.u0 = u - S.PW / S.k / 2; R.clampView(); redraw(); };
  mm.addEventListener('pointerdown', (ev) => { mdrag = true; mm.setPointerCapture(ev.pointerId); mmGo(ev); });
  mm.addEventListener('pointermove', (ev) => { if (mdrag) mmGo(ev); });
  mm.addEventListener('pointerup', () => { mdrag = false; updatePanel(); });

  // ---------- hint ----------
  let hintT = setTimeout(hideHint, 9000);
  function hideHint() { clearTimeout(hintT); $('hint').classList.add('off'); }

  // ---------- boot ----------
  applyTheme();
  if (S.show) setShow(S.show, true);
  R.resize(); R.layout(); sizeMini();
  // a phone can't show 6,600 years in ~290px, so it opens on the last five centuries
  if (S.W < 640) R.fit(1500, 2030, 0.02); else R.fit(-4600, 2030, 0.01);
  if (matchMedia('(pointer: coarse)').matches) $('hint').textContent = 'کشیدن = جابه‌جایی · دو انگشت = بزرگ‌نمایی · لمس = ثابت‌کردن برش زمان';
  if (window.innerWidth <= 1100) openPanel(false);
  updatePanel(); redraw();
  const fontsReady = () => { R.clearCache(); R.layout(); redraw(); };
  if (document.fonts) {
    ['400 12px Vazirmatn', '500 12px Vazirmatn', '700 12px Vazirmatn'].forEach(f => document.fonts.load(f, 'ایران').then(fontsReady, () => { }));
    document.fonts.ready.then(fontsReady);
  }
  // keep the panel in sync with the view when nothing is pinned (debounced on view changes)
  let lastView = '';
  setInterval(() => {
    if (S.focus || S.pinYear != null) return;
    const v = Math.round(S.u0) + ':' + S.k.toFixed(3);
    if (v !== lastView) { lastView = v; updatePanel(); }
  }, 600);
  window.JAM = { S, R, TL, select, updatePanel };
})();

</script>
